{% extends "base.html" %}

{% block title %}VAC - Registrar Dispositiu{% endblock %}

{% block content %}
<div class="form-container">
    <h1>Registrar un Nou Dispositiu</h1>
    {% if success_message %}
        <p class="success-message">{{ success_message }}</p>
    {% endif %}
    <form method="post" action="/dashboard/devices/register">
        <div class="form-group">
            <label for="name">Nom del Dispositiu:</label>
            <input type="text" id="name" name="name" required>
        </div>
        <div class="form-group">
            <label for="latitude">Latitud:</label>
            <input type="number" id="latitude" name="latitude" step="any" required>
        </div>
        <div class="form-group">
            <label for="longitude">Longitud:</label>
            <input type="number" id="longitude" name="longitude" step="any" required>
        </div>
        <button type="submit" class="cta-button">Registrar</button>
    </form>
    <a href="/dashboard/" class="back-link">Tornar al Dashboard</a>
</div>
{% endblock %}
